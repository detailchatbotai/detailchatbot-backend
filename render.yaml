services:
  - type: web
    name: detailchatbot-api-dev
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: development
      - key: DEBUG
        value: true
      # All other environment variables set via Render dashboard
        
  - type: pserv
    name: detailchatbot-db-dev
    plan: starter