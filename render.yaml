services:
  - type: web
    name: detailchatbot-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
        
  - type: pserv
    name: detailchatbot-db
    plan: starter
    databaseName: detailchatbot
    databaseUser: detailchatbot_user